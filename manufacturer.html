<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Management</title>
</head>
<body>
    <h1>QR Code Management</h1>
    
    <!-- Form to Add Product -->
    <h2>Add Product</h2>
    <form id="addProductForm">
        <input type="number" id="productId" name="productId" placeholder="Product ID" required>
        <input type="text" id="name" name="name" placeholder="Product Name" required>
        <input type="text" id="manufactureDate" name="manufactureDate" placeholder="Manufacture Date" required>
        <input type="text" id="batch" name="batch" placeholder="Batch" required>
        <button type="submit">Add Product</button>
    </form>
    <img id="qrCodeImage" alt="Generated QR Code" style="display:none;"/>

    <!-- Form to Verify QR Code -->
    <h2>Verify QR Code</h2>
    <form id="verifyQRForm">
        <input type="number" id="verifyProductId" name="productId" placeholder="Product ID" required>
        <input type="text" id="qrCodeInput" name="qrCode" placeholder="Paste QR Code Data URL" required>
        <button type="submit">Verify QR Code</button>
    </form>
    <p id="verifyResult"></p>

    <script>
        const addProductForm = document.getElementById('addProductForm');
        const qrCodeImage = document.getElementById('qrCodeImage');
        const verifyQRForm = document.getElementById('verifyQRForm');
        const verifyResult = document.getElementById('verifyResult');

        // Add Product Form Submission
        addProductForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(addProductForm);
            const data = Object.fromEntries(formData.entries());

            const response = await fetch('/api/addProduct', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            if (result.qrCode) {
                qrCodeImage.src = result.qrCode;
                qrCodeImage.style.display = 'block';
            } else {
                alert('Error adding product.');
            }
        });

        // Verify QR Code Form Submission
        verifyQRForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(verifyQRForm);
            const data = Object.fromEntries(formData.entries());

            const response = await fetch('/api/verifyQR', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            verifyResult.textContent = result.message || 'Error verifying QR code.';
        });
    </script>
</body>
</html>
